name: Deploy to Vercel

on:
  push:
    branches: ['**']
  workflow_dispatch:

# A newer push to the same branch cancels an in-flight build, matching the
# behaviour the Vercel Git integration gave us for free.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  # Durable hostname for the staging branch. CLI deploys don't get the
  # *-git-<branch>-* aliases the Vercel Git integration used to create, so we
  # assign one ourselves.
  STAGING_ALIAS: zoomy-pos-staging.vercel.app

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Resolve target environment
        id: target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "prod_flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
            echo "prod_flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=${{ steps.target.outputs.environment }} --token=${{ secrets.VERCEL_TOKEN }}

      # Runs the buildCommand from vercel.json (npm run build:web), so the
      # Expo export and the PWA patch behave exactly as they did before.
      - name: Build
        run: vercel build ${{ steps.target.outputs.prod_flag }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ steps.target.outputs.prod_flag }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### ${{ steps.target.outputs.environment }} deployment"
            echo ""
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"

      # Point a fixed hostname at the newest staging build, so testers have one
      # URL instead of a new random preview URL on every push.
      - name: Alias staging deployment
        if: github.ref == 'refs/heads/staging'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          vercel alias set "$URL" "$STAGING_ALIAS" --token=${{ secrets.VERCEL_TOKEN }}
          echo "Staging is live at https://$STAGING_ALIAS" >> "$GITHUB_STEP_SUMMARY"

      # Replaces the preview link the Vercel bot used to leave on PRs.
      - name: Comment deployment URL on the open pull request
        if: steps.target.outputs.environment == 'preview'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          pr=$(gh pr list --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number')
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --body "Preview deployment for \`${{ github.sha }}\`: $URL"
          else
            echo "No open PR for ${{ github.ref_name }} — skipping comment."
          fi
